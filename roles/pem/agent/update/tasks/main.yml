- name: Include pem-agent-pre-update hook
  include_tasks: "{{ hook }}"
  when:
    lookup('first_found', dict(files=hook, skip=True))
  vars:
    hook: "{{ cluster_dir }}/hooks/pem-agent-pre-update.yml"

- name: Remove libcurl-minimal if it is installed
  include_role:
    name: pem/agent/pkg
    tasks_from: remove-package.yml
  vars:
    package_name: 'libcurl-minimal'

- name: Upgrade 'edb-pem-agent' package
  include_role:
    name: pem/agent/pkg
  vars:
    _allow_package_upgrades: yes

- name: Include pem-agent-post-update hook
  include_tasks: "{{ hook }}"
  when:
    lookup('first_found', dict(files=hook, skip=True))
  vars:
    hook: "{{ cluster_dir }}/hooks/pem-agent-post-update.yml"