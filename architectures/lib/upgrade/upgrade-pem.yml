# To use testing playbook in a cluster:
# 1) Create a symlink to the pem upgrade testing playbook in the cluster's commands directory
#   ln -s ~/tpa-internal/architectures/lib/upgrade/upgrade-pem.yml commands/upgrade-pem.yml
# 2) Change 'pem_package_version', provision and run the playbook
#   tpaexec provision . && tpaexec upgrade-pem .

- import_playbook: "{{ tpa_dir }}/architectures/lib/init.yml"
  vars:
    upgrade_in_progress: true
  tags: always

- import_playbook: "{{ tpa_dir }}/architectures/lib/dynamic_groups.yml"
  tags: always

- name: Run clusterwide health check before upgrade
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: PEM health check # No-op right now, will discuss with Simon/PEM team what "health" means and how we can test against it.
    debug:
      msg: "ok"
    when: "'pem-server' in role"

- name: Check if edb-pem-agent version can be upgraded on PEM agents
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pem-agent:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('pem-agent') or upgrade_selector|strict_selects('all')
    block:
    - name: Check if edb-pem-agent can be updated to specified package version  
      include_role:
        name: pem/agent/pkg
        tasks_from: check-update.yml
      when: pem_agent_package_version is defined
    
    - set_fact:
        can_upgrade_pem_agent: "{{ pem_agent_package_update | default(true) }}"

- name: Check if edb-pem version can be upgraded on PEM servers
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pem-server:&g_update_hosts
  tasks:
  - when:
    - upgrade_selector|strict_selects('pem-server') or upgrade_selector|strict_selects('all')
    block:
    - name: Check if edb-pem can be updated to specified package version  
      include_role:
        name: pem/server/pkg
        tasks_from: check-update.yml
      when: pem_server_package_version is defined
    
    - set_fact:
        can_upgrade_pem_server: "{{ pem_server_package_update | default(true) }}"

- name: Upgrade edb-pem-agent
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pem-agent:&g_update_hosts
  tasks:
  - include_role: name=pem/agent/update
    when: 
    - upgrade_selector|strict_selects('pem-agent') or upgrade_selector|strict_selects('all')
    - can_upgrade_pem_agent

- name: Upgrade edb-pem
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: role_pem-server:&g_update_hosts
  tasks:
  - include_role: name=pem/server/update
    when: 
    - upgrade_selector|strict_selects('pem-server') or upgrade_selector|strict_selects('all')
    - can_upgrade_pem_server

- name: Run post-upgrade health check for the cluster
  any_errors_fatal: true
  max_fail_percentage: 0
  become_user: root
  become: yes
  environment: "{{ target_environment }}"
  hosts: all
  tasks:  
  - name: PEM health check # No-op right now, will discuss with Simon/PEM team what "health" means and how we can test against it.
    debug:
      msg: "ok"
    when: "'pem-server' in role"