- summary: Fix race conditions during concurrent updates to the Barman .pgpass file
  description: |
      Previously, when multiple backed-up nodes attempted to update the Barman
      node's .pgpass file concurrently, a race condition could occur, resulting in
      partial or incomplete entries. TPA now serializes this process, ensuring that the
      Barman node's .pgpass file is updated sequentially to prevent loss.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: bugfix
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1207
  support_tickets:
  - CP52460
