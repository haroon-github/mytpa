- summary: Add auto.basebackup property for EFM 5.2 and above
  description: |
    Starting with EFM 5.2, there will be a new property `auto.basebackup`
    that adds on to the new auto-rebuild capability. Users can use the
    existing pg_rewind feature, pg_basebackup, or tell EFM to use both
    (pg_basebackup will be run if pg_rewind fails).
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: minor_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You must have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1205
