- summary: Minor version upgrades for PGD-X
  description: |
    The `tpaexec upgrade` command can now perform minor version upgrades of
    postgres and PGD on a cluster running the PGD-X architecture.

    The upgrade process checks cluster health and upgrades the nodes
    one at a time.
    This scenario supports the use of `update_hosts` variable to upgrade a subset of
    the cluster when used accordingly to the best practice recommendations found 
    in the documentation.
  # Possible types: notable_change, minor_change, bugfix or breaking_change
  type: notable_change
  # At least one between jira_tickets or support_tickets must be defined. You
  # can define both if you want
  # You musnort have at least one list item in each *_tickets section that is
  # defined
  jira_tickets:
  - TPA-1040
